Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
# Logs go to stderr under -d (collected with `docker logs`). Connect level records every
# CONNECT and every denial.
LogLevel Connect
# Allowlist by hostname. Everything not matching is refused with 403.
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
# HTTPS tunnels only, to 443 only. Plain HTTP is still filtered by host.
ConnectPort 443
DisableViaHeader Yes
