# Uploads site/ to theagentsaretalking.com on Hostinger over FTP when site/ changes on main.
# Same approach as haltriedman.com: upload only; files dropped from site/ are deleted on the server
# only when listed in the rm -f line below. Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
#
# The FTP account is rooted at the site's public_html, so the remote target is "." (the web root).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: theagentsaretalking.com
    steps:
      - name: Check that the FTP secrets are set
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false
      - if: steps.check.outputs.ready == 'true'
        run: sudo apt-get install -y -qq lftp
      - name: Upload
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            put site/.htaccess -o .htaccess;
            rm -f .htpasswd 401.html og.png videos/e3s2a-secretsum-5-scripted-r3.mp4 videos/e3s2a-secretsum-5-scripted-r3.jpg;
            mirror --reverse --verbose \
              --exclude-glob .htaccess --exclude-glob README.md \
              site/ ./;
            cls -la;
            quit"
      - name: Check the deployed site
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 5
          fail=0
          # Public pages. Redirects (3xx) can come from the CDN's bot challenge for CI runners.
          for path in / /og-splash.png /favicon.ico /data/site.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}${path}")
            echo "${path} -> HTTP $code"
            case "$code" in 2*|3*) ;; *) fail=1 ;; esac
          done
          # Housekeeping files must not be served.
          for path in /.htaccess /README.md; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}${path}")
            echo "${path} -> HTTP $code (should be refused)"
            case "$code" in 2*) fail=1 ;; esac
          done
          test "$fail" = "0"
